  <rect x="590" y="20" width="168" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="604" y="34" width="38" height="22" rx="5" fill="#EFF6FF"/>
  <polygon points="614,40 622,45 614,50" fill="#2563EB"/>
  <text x="626" y="49" fill="#1D4ED8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">04</text>
  <text x="604" y="78" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700">Engine Prompts</text>
  <text x="604" y="99" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Kling · Seedance · Hailuo</text>
  <text x="604" y="118" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Wan · Sora · Runway</text>
  <rect x="604" y="138" width="140" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="612" y="154" fill="#0F172A" font-family="Consolas, monospace" font-size="11">prompts.json</text>

  <!-- Arrow 4->5 -->
  <path d="M762 98H776" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M772 94L777 98L772 102" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 5 -->
  <rect x="780" y="20" width="160" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="794" y="34" width="38" height="22" rx="5" fill="#EFF6FF"/>
  <polygon points="804,40 812,45 804,50" fill="#2563EB"/>
  <text x="816" y="49" fill="#1D4ED8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">05</text>
  <text x="794" y="78" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700">Anti-Drift Lint</text>
  <text x="794" y="99" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Block fingers &amp; Lego pegs</text>
  <text x="794" y="118" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Auto-rescue prompt</text>
  <rect x="794" y="138" width="132" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="802" y="154" fill="#0F172A" font-family="Consolas, monospace" font-size="11">drift_check.mjs</text>
</svg>
