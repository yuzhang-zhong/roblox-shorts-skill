  <text x="414" y="99" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">1 action per 3.5–4s shot</text>
  <text x="414" y="118" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Hook · Twist · Loop cut</text>
  <rect x="414" y="138" width="140" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="422" y="154" fill="#0F172A" font-family="Consolas, monospace" font-size="11">shot_compiler.mjs</text>

