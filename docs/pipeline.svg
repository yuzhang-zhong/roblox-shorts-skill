<svg width="960" height="196" viewBox="0 0 960 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf-en-title wf-en-desc">
  <title id="wf-en-title">Roblox Style Video Skill workflow</title>
  <desc id="wf-en-desc">Five-step Agent Skill workflow: Lock Avatar DNA, Render Turnaround and First Frames, Plan 9:16 Storyboard, Compile Engine Prompts, and Lint for Drift.</desc>

  <rect width="960" height="196" rx="14" fill="#F8FAFC"/>
  <rect x="1" y="1" width="958" height="194" rx="13" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Step 1 -->
  <rect x="20" y="20" width="168" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="34" y="34" width="38" height="22" rx="5" fill="#EFF6FF"/>
  <polygon points="44,40 52,45 44,50" fill="#2563EB"/>
  <text x="56" y="49" fill="#1D4ED8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">01</text>
  <text x="34" y="78" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700">Lock Avatar DNA</text>
  <text x="34" y="99" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">2x2x1 torso · 1x2x1 limbs</text>
  <text x="34" y="118" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Solid hands · 2D decal</text>
  <rect x="34" y="138" width="140" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="42" y="154" fill="#0F172A" font-family="Consolas, monospace" font-size="11">avatar_spec.mjs</text>

  <!-- Arrow 1->2 -->
  <path d="M192 98H206" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M202 94L207 98L202 102" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="210" y="20" width="168" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="224" y="34" width="38" height="22" rx="5" fill="#EFF6FF"/>
  <polygon points="234,40 242,45 234,50" fill="#2563EB"/>
  <text x="246" y="49" fill="#1D4ED8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">02</text>
  <text x="224" y="78" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="14.5" font-weight="700">3D Animatic &amp; I2V</text>
  <text x="224" y="99" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">0° / 45° / 90° turnaround</text>
  <text x="224" y="118" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="11">Local MP4 &amp; GIF preview</text>
  <rect x="224" y="138" width="140" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="232" y="154" fill="#0F172A" font-family="Consolas, monospace" font-size="11">render_preview.mjs</text>

  <!-- Arrow 2->3 -->
  <path d="M382 98H396" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M392 94L397 98L392 102" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="400" y="20" width="168" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="414" y="34" width="38" height="22" rx="5" fill="#EFF6FF"/>
  <polygon points="424,40 432,45 424,50" fill="#2563EB"/>
  <text x="436" y="49" fill="#1D4ED8" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700">03</text>
