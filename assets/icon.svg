<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Roblox Shorts Skill icon</title>
  <desc id="desc">A stylized 3D blocky character with a cylindrical yellow head, 2D decal face, chamfered ABS torso, and a vertical short-video frame badge.</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="40" x2="456" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="headYellow" x1="186" y1="102" x2="326" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="torsoBlue" x1="168" y1="234" x2="344" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="armYellow" x1="108" y1="238" x2="162" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="badgeRed" x1="322" y1="312" x2="444" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="drop" x="68" y="64" width="384" height="396" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.55"/>

  <!-- Subtle 9:16 vertical viewfinder corners -->
  <path d="M96 116V84H128" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <path d="M416 116V84H384" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <path d="M96 396V428H128" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- REC indicator -->
  <circle cx="144" cy="100" r="8" fill="#F43F5E"/>
  <text x="160" y="106" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">9:16 R6</text>

  <!-- Roblox-style blocky character -->
  <g filter="url(#drop)">
    <!-- Left Arm (raised wave) -->
    <rect x="104" y="218" width="54" height="136" rx="12" transform="rotate(-14 104 218)" fill="url(#armYellow)" stroke="#FEF9C3" stroke-width="3"/>
    <!-- Right Arm -->
    <rect x="350" y="236" width="54" height="136" rx="12" transform="rotate(8 350 236)" fill="url(#armYellow)" stroke="#FEF9C3" stroke-width="3"/>

    <!-- Blocky Legs (peek at bottom) -->
    <rect x="176" y="376" width="72" height="58" rx="10" fill="#10B981" stroke="#6EE7B7" stroke-width="3"/>
    <rect x="260" y="376" width="72" height="58" rx="10" fill="#059669" stroke="#6EE7B7" stroke-width="3"/>

    <!-- Blocky Torso -->
    <rect x="168" y="232" width="172" height="154" rx="16" fill="url(#torsoBlue)" stroke="#BAE6FD" stroke-width="4"/>
    <!-- Torso glossy chamfer highlight -->
    <path d="M188 248H320" stroke="#E0F2FE" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <!-- Graphic badge on shirt -->
    <rect x="226" y="280" width="56" height="56" rx="12" transform="rotate(12 254 308)" fill="#0F172A" opacity="0.28"/>
    <rect x="234" y="288" width="40" height="40" rx="8" transform="rotate(12 254 308)" fill="#F8FAFC" opacity="0.9"/>

    <!-- Cylindrical Beveled Head -->
    <rect x="184" y="102" width="140" height="124" rx="34" fill="url(#headYellow)" stroke="#FEF08A" stroke-width="4"/>
    <!-- Head top specular highlight -->
    <path d="M214 118H294" stroke="#FFFBEB" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

    <!-- Classic 2D Decal Face -->
    <ellipse cx="228" cy="158" rx="8" ry="11" fill="#0F172A"/>
    <ellipse cx="280" cy="158" rx="8" ry="11" fill="#0F172A"/>
    <circle cx="225" cy="154" r="3" fill="#FFFFFF"/>
    <circle cx="277" cy="154" r="3" fill="#FFFFFF"/>
    <path d="M224 184C236 200 272 200 284 184" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Video Play / Clapper Badge -->
  <g filter="url(#drop)">
    <circle cx="384" cy="376" r="60" fill="url(#badgeRed)" stroke="#FFE4E6" stroke-width="6"/>
    <path d="M368 350L412 376L368 402V350Z" fill="#FFFFFF"/>
  </g>
</svg>
